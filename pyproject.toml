[project]
name = "agents-from-scratch"
version = "0.1.0"
description = "Build an e-mail assistant from scratch"
readme = "README.md"
authors = [{ name = "Rex Kelly", email = "rexk638@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.41",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "loguru>=0.8.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[project.scripts]
agents-from-scratch = "agents_from_scratch.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[build]
